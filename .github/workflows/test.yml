name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      # Clipboard round-trip tests need a display server on Linux (xvfb + xclip).
      # Wayland and WSL clipboard paths cannot be covered by CI — see docs/future-work.md.
      - name: Clipboard integration tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xvfb
          xvfb-run -a npm run test:clipboard

      - name: Clipboard integration tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:clipboard
